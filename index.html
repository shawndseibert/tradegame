<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leverage Trading Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.0/dist/chartjs-chart-financial.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>

    <style>
        /* Custom font and dark theme styling */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #E0E0E0;
        }
        .card {
            background-color: #1E1E1E;
            border: 1px solid #333;
        }
        #chart-container {
            position: relative;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #4F46E5;
            cursor: pointer;
            border-radius: 50%;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #4F46E5;
            cursor: pointer;
            border-radius: 50%;
        }
    </style>
</head>
<body class="p-4">

    <div class="flex flex-col lg:grid lg:grid-cols-3 lg:grid-rows-[min-content_1fr_min-content] gap-4 h-full">
        
        <div class="card rounded-lg p-4 shadow-lg lg:col-start-3 lg:row-start-1">
            <h2 class="text-xl font-bold mb-4">Settings</h2>
            <div class="space-y-3">
                 <div>
                    <label for="timeframe-select" class="block text-sm font-medium text-gray-300 mb-1">Timeframe</label>
                    <select id="timeframe-select" class="w-full bg-gray-800 border border-gray-600 rounded-md p-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="1">1 Minute</option>
                        <option value="5" selected>5 Minutes</option>
                        <option value="15">15 Minutes</option>
                        <option value="60">1 Hour</option>
                    </select>
                </div>
                 <div class="grid grid-cols-2 gap-3">
                    <select id="candle-type" class="w-full bg-gray-800 border border-gray-600 rounded-md p-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="candlestick" selected>Candlestick</option>
                        <option value="heikinashi">Heikin Ashi</option>
                    </select>
                    <button id="reset-view-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">Auto</button>
                </div>
                <div>
                    <label for="speed-slider" class="block text-sm font-medium text-gray-300">Game Speed</label>
                    <div class="flex items-center gap-2">
                        <input type="range" id="speed-slider" min="1" max="200" value="1" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                        <span id="speed-value" class="font-semibold text-indigo-400 w-12 text-center">1x</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="chart-container" class="flex-grow rounded-lg shadow-lg card p-2 min-h-[300px] lg:col-span-2 lg:row-span-2 lg:col-start-1 lg:row-start-1">
            <canvas id="trading-chart"></canvas>
        </div>

        <div class="card rounded-lg p-4 shadow-lg lg:col-start-3 lg:row-start-2">
            <h2 class="text-xl font-bold mb-4">Place Trade</h2>
            <div class="space-y-4">
                <div>
                    <label for="trade-size" class="block text-sm font-medium text-gray-300">Trade Size (Margin)</label>
                    <input type="number" id="trade-size" value="100" class="w-full mt-1 bg-gray-800 border border-gray-600 rounded-md p-2 focus:ring-indigo-500 focus:border-indigo-500">
                    <div id="size-percentage-buttons" class="grid grid-cols-4 gap-2 mt-2">
                        <button class="bg-gray-700 hover:bg-gray-600 text-xs py-1 rounded transition-colors" data-percent="0.25">25%</button>
                        <button class="bg-gray-700 hover:bg-gray-600 text-xs py-1 rounded transition-colors" data-percent="0.50">50%</button>
                        <button class="bg-gray-700 hover:bg-gray-600 text-xs py-1 rounded transition-colors" data-percent="0.75">75%</button>
                        <button class="bg-gray-700 hover:bg-gray-600 text-xs py-1 rounded transition-colors" data-percent="1.00">100%</button>
                    </div>
                </div>
                <div>
                    <label for="leverage" class="block text-sm font-medium text-gray-300">Leverage</label>
                    <div class="flex items-center gap-2">
                        <input type="range" id="leverage" min="1" max="100" value="10" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                        <span id="leverage-value" class="font-semibold text-indigo-400 w-12 text-center">10x</span>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button id="long-button" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">Long</button>
                    <button id="short-button" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">Short</button>
                </div>
            </div>
        </div>

        <div id="positions-panel" class="min-h-[150px] overflow-y-auto rounded-lg shadow-lg card p-4 lg:col-span-2 lg:col-start-1 lg:row-start-3">
            <h2 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">Open Positions</h2>
            <div id="positions-list" class="space-y-2">
                <p id="no-positions-msg" class="text-gray-400">No open positions.</p>
            </div>
        </div>
        
        <div class="card rounded-lg p-4 shadow-lg lg:col-start-3 lg:row-start-3">
             <h2 class="text-xl font-bold mb-3">Account</h2>
            <div class="space-y-2 text-sm">
                <div class="flex justify-between"><span>Balance:</span> <span id="balance">$10,000.00</span></div>
                <div class="flex justify-between"><span>Equity:</span> <span id="equity">$10,000.00</span></div>
                <div class="flex justify-between"><span>Unrealized P/L:</span> <span id="unrealized-pl">$0.00</span></div>
            </div>
        </div>

    </div>

    <div id="message-box" class="fixed top-5 right-5 bg-indigo-600 text-white py-2 px-4 rounded-lg shadow-lg opacity-0 pointer-events-none z-50 transition-opacity duration-300 ease-in-out">
        <p id="message-text"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Element References ---
            const balanceEl = document.getElementById('balance');
            const equityEl = document.getElementById('equity');
            const unrealizedPlEl = document.getElementById('unrealized-pl');
            const leverageSlider = document.getElementById('leverage');
            const leverageValueEl = document.getElementById('leverage-value');
            const tradeSizeInput = document.getElementById('trade-size');
            const longButton = document.getElementById('long-button');
            const shortButton = document.getElementById('short-button');
            const positionsListEl = document.getElementById('positions-list');
            const noPositionsMsgEl = document.getElementById('no-positions-msg');
            const candleTypeSelect = document.getElementById('candle-type');
            const speedSlider = document.getElementById('speed-slider');
            const speedValueEl = document.getElementById('speed-value');
            const resetViewBtn = document.getElementById('reset-view-btn');
            const timeframeSelect = document.getElementById('timeframe-select');
            const sizePercentageButtonsEl = document.getElementById('size-percentage-buttons');

            // --- Game State ---
            let account = { balance: 10000, equity: 10000 };
            let openPositions = [];
            let masterOneMinuteData = [];
            let lastPrice = 50000;
            let lastTime = new Date().getTime();
            let gameLoopInterval;
            const MAX_DATA_POINTS = 10000;

            // --- Chart.js State ---
            const ctx = document.getElementById('trading-chart').getContext('2d');
            let tradingChart;
            let uiNeedsUpdate = true;
            const DEFAULT_VISIBLE_CANDLES = 50;
            const MIN_VISIBLE_CANDLES = 20;
            let visibleCandleCount = DEFAULT_VISIBLE_CANDLES;
            let currentTimeframe = 5;

            // --- Chart.js Setup ---
            function createChart(persistedAnnotations = {}) {
                if (tradingChart) tradingChart.destroy();
                const config = {
                    type: 'candlestick',
                    data: { datasets: [{ label: 'Price', data: [] }] },
                    options: {
                        responsive: true, maintainAspectRatio: false, animation: false,
                        scales: {
                            x: { type: 'time', time: { unit: 'minute' }, grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#E0E0E0' } },
                            y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#E0E0E0' } }
                        },
                        plugins: {
                            legend: { display: false },
                            annotation: { annotations: persistedAnnotations },
                            zoom: {
                                pan: { enabled: false },
                                zoom: {
                                    wheel: { enabled: true }, mode: 'x',
                                    onZoom: ({ chart }) => {
                                        const timespan = chart.scales.x.max - chart.scales.x.min;
                                        const timeframeMillis = currentTimeframe * 60 * 1000;
                                        const newCandleCount = Math.round(timespan / timeframeMillis);
                                        visibleCandleCount = Math.max(MIN_VISIBLE_CANDLES, newCandleCount);
                                        uiNeedsUpdate = true;
                                    }
                                }
                            }
                        }
                    }
                };
                tradingChart = new Chart(ctx, config);
            }

            // --- Data Generation & Transformation ---
            function generateOneMinuteCandle() {
                const changePercent = (Math.random() - 0.5) * 0.005;
                const change = lastPrice * changePercent;
                const open = lastPrice; const close = open + change;
                const high = Math.max(open, close) + (Math.random() * Math.abs(change) * 2);
                const low = Math.min(open, close) - (Math.random() * Math.abs(change) * 2);
                lastPrice = close; lastTime += 60000;
                return { x: lastTime, o: open, h: high, l: low, c: close };
            }

            function regenerateMasterData() {
                masterOneMinuteData = []; lastPrice = 50000;
                const historyMinutes = 5000;
                lastTime = new Date().getTime() - (historyMinutes * 60000);
                for (let i = 0; i < historyMinutes; i++) masterOneMinuteData.push(generateOneMinuteCandle());
            }

            function aggregateData(data, timeframeMinutes) {
                if (timeframeMinutes <= 1) return data;
                const aggregated = [];
                let currentCandle = null;
                for (const candle of data) {
                    const candleTime = new Date(candle.x);
                    const intervalStart = new Date(candleTime);
                    intervalStart.setMinutes(Math.floor(candleTime.getMinutes() / timeframeMinutes) * timeframeMinutes, 0, 0);
                    if (!currentCandle || currentCandle.x !== intervalStart.getTime()) {
                        if (currentCandle) aggregated.push(currentCandle);
                        currentCandle = { x: intervalStart.getTime(), o: candle.o, h: candle.h, l: candle.l, c: candle.c };
                    } else {
                        currentCandle.h = Math.max(currentCandle.h, candle.h);
                        currentCandle.l = Math.min(currentCandle.l, candle.l);
                        currentCandle.c = candle.c;
                    }
                }
                if (currentCandle) aggregated.push(currentCandle);
                return aggregated;
            }
            
            // --- Game & Render Loops ---
            function gameLoop() {
                masterOneMinuteData.push(generateOneMinuteCandle());
                if (masterOneMinuteData.length > MAX_DATA_POINTS) masterOneMinuteData.shift();

                let totalPnl = 0;
                openPositions.forEach(pos => {
                    const priceDiff = lastPrice - pos.entryPrice;
                    const quantity = (pos.margin * pos.leverage) / pos.entryPrice;
                    pos.pnl = (pos.type === 'long') ? priceDiff * quantity : -priceDiff * quantity;
                    totalPnl += pos.pnl;
                });
                account.equity = account.balance + totalPnl;
                uiNeedsUpdate = true;
            }

            function renderLoop() {
                if (uiNeedsUpdate && masterOneMinuteData.length > 0) {
                    const aggregatedData = aggregateData(masterOneMinuteData, currentTimeframe);
                    if (aggregatedData.length === 0) { requestAnimationFrame(renderLoop); return; }
                    let displayData = (candleTypeSelect.value === 'heikinashi') ? toHeikinAshi(aggregatedData) : aggregatedData;
                    tradingChart.data.datasets[0].data = displayData;

                    const lastCandleTime = displayData[displayData.length - 1].x;
                    const firstVisibleCandleIndex = Math.max(0, displayData.length - visibleCandleCount);
                    const firstVisibleCandleTime = displayData[firstVisibleCandleIndex].x;
                    tradingChart.options.scales.x.max = lastCandleTime;
                    tradingChart.options.scales.x.min = firstVisibleCandleTime;
                    tradingChart.update('none');

                    balanceEl.textContent = `$${account.balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                    equityEl.textContent = `$${account.equity.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                    const totalPnl = account.equity - account.balance;
                    unrealizedPlEl.textContent = `$${totalPnl.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                    unrealizedPlEl.style.color = totalPnl >= 0 ? '#4ade80' : '#f87171';
                    
                    updatePositionsList();
                    uiNeedsUpdate = false;
                }
                requestAnimationFrame(renderLoop);
            }
            
            // --- Initial Setup ---
            function init() {
                currentTimeframe = parseInt(timeframeSelect.value, 10);
                regenerateMasterData();
                createChart();
                setGameSpeed(1);
                requestAnimationFrame(renderLoop);
            }

            // --- Event Listeners ---
            leverageSlider.addEventListener('input', (e) => { leverageValueEl.textContent = `${e.target.value}x`; });
            speedSlider.addEventListener('input', (e) => {
                const speed = parseInt(e.target.value, 10);
                speedValueEl.textContent = `${speed}x`; setGameSpeed(speed);
            });
            resetViewBtn.addEventListener('click', () => {
                visibleCandleCount = DEFAULT_VISIBLE_CANDLES; 
                uiNeedsUpdate = true;
            });
            timeframeSelect.addEventListener('change', (e) => {
                currentTimeframe = parseInt(e.target.value, 10);
                visibleCandleCount = DEFAULT_VISIBLE_CANDLES;
                uiNeedsUpdate = true;
            });
            sizePercentageButtonsEl.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON' && e.target.dataset.percent) {
                    const percent = parseFloat(e.target.dataset.percent);
                    const newSize = account.balance * percent;
                    tradeSizeInput.value = newSize.toFixed(2);
                }
            });

            longButton.addEventListener('click', () => placeTrade('long'));
            shortButton.addEventListener('click', () => placeTrade('short'));
            candleTypeSelect.addEventListener('change', () => uiNeedsUpdate = true);

            // --- Utility Functions (unchanged, collapsed for brevity) ---
            function toHeikinAshi(data) { if (data.length < 1) return []; const haData = []; let prevHaOpen = data[0].o; let prevHaClose = data[0].c; for (let i = 0; i < data.length; i++) { const curr = data[i]; const haClose = (curr.o + curr.h + curr.l + curr.c) / 4; const haOpen = (prevHaOpen + prevHaClose) / 2; const haHigh = Math.max(curr.h, haOpen, haClose); const haLow = Math.min(curr.l, haOpen, haClose); haData.push({ x: curr.x, o: haOpen, h: haHigh, l: haLow, c: haClose }); prevHaOpen = haOpen; prevHaClose = haClose; } return haData; }
            function placeTrade(type) { const size = parseFloat(tradeSizeInput.value); if (isNaN(size) || size <= 0) { showMessage("Please enter a valid trade size.", "error"); return; } if (size > account.balance) { showMessage("Trade size cannot exceed your balance.", "error"); return; } const position = { id: `pos-${Date.now()}`, type, margin: size, leverage: parseInt(leverageSlider.value), entryPrice: lastPrice, pnl: 0, }; const annotation = { type: 'line', yMin: position.entryPrice, yMax: position.entryPrice, borderColor: type === 'long' ? '#26A69A' : '#EF5350', borderWidth: 2, borderDash: [6, 6], label: { content: `${type.toUpperCase()} @ ${position.entryPrice.toFixed(2)}`, enabled: true, position: 'end', backgroundColor: 'rgba(0,0,0,0.6)' } }; tradingChart.options.plugins.annotation.annotations[position.id] = annotation; openPositions.push(position); uiNeedsUpdate = true; }
            function closePosition(id) { const positionIndex = openPositions.findIndex(p => p.id === id); if (positionIndex > -1) { const position = openPositions[positionIndex]; account.balance += position.pnl; delete tradingChart.options.plugins.annotation.annotations[id]; document.getElementById(id)?.remove(); openPositions.splice(positionIndex, 1); uiNeedsUpdate = true; } }
            function updatePositionsList() { noPositionsMsgEl.style.display = openPositions.length === 0 ? 'block' : 'none'; openPositions.forEach(pos => { let posEl = document.getElementById(pos.id); if (!posEl) { posEl = document.createElement('div'); posEl.id = pos.id; posEl.innerHTML = `<span class="font-bold"></span><span></span><span></span><span></span><button class="close-pos-btn bg-gray-600 hover:bg-gray-500 text-white text-xs py-1 px-2 rounded">Close</button>`; positionsListEl.appendChild(posEl); posEl.querySelector('.close-pos-btn').addEventListener('click', () => closePosition(pos.id)); } const pnlColor = pos.pnl >= 0 ? 'text-green-400' : 'text-red-400'; const bgColor = pos.pnl >= 0 ? 'bg-green-900/30' : 'bg-red-900/30'; const typeColor = pos.type === 'long' ? 'text-green-400' : 'text-red-400'; posEl.className = `grid grid-cols-5 gap-2 items-center text-sm p-2 rounded-md ${bgColor}`; const fields = posEl.children; fields[0].className = `font-bold ${typeColor}`; fields[0].textContent = pos.type.toUpperCase(); fields[1].textContent = `$${pos.margin.toFixed(2)} (${pos.leverage}x)`; fields[2].textContent = pos.entryPrice.toFixed(2); fields[3].className = pnlColor; fields[3].textContent = pos.pnl.toFixed(2); }); }
            function setGameSpeed(speed) { if (gameLoopInterval) clearInterval(gameLoopInterval); const intervalTime = Math.max(1, 1000 / speed); gameLoopInterval = setInterval(gameLoop, intervalTime); }
            let messageTimeout; function showMessage(text, type = "info", duration = 3000) { const messageBox = document.getElementById('message-box'); const messageText = document.getElementById('message-text'); if (messageTimeout) clearTimeout(messageTimeout); messageBox.style.backgroundColor = type === 'error' ? '#dc2626' : '#4f46e5'; messageText.textContent = text; messageBox.classList.remove('opacity-0', 'pointer-events-none'); messageTimeout = setTimeout(() => { messageBox.classList.add('opacity-0'); setTimeout(() => messageBox.classList.add('pointer-events-none'), 300); }, duration); }

            init();
        });
    </script>
</body>
</html>
