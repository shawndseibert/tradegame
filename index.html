<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leverage Trading Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.0/dist/chartjs-chart-financial.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #E0E0E0;
        }
        .card {
            background-color: #1E1E1E;
            border: 1px solid #333;
        }
        #chart-container {
            position: relative;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 20px; height: 20px;
            background: #4F46E5; cursor: pointer; border-radius: 50%;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px; height: 20px;
            background: #4F46E5; cursor: pointer; border-radius: 50%;
        }
        .toggle-checkbox:checked { background-color: #4F46E5; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4F46E5; }
        .toggle-checkbox:checked + .toggle-label .toggle-ball { transform: translateX(100%); }

        /* --- Title Banner Base Style --- */
        #title-banner {
            transition: background 0.5s ease-in-out;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* --- Individual Banner Styles --- */
        .banner-ramen { background-color: #b7791f; } /* Sad Brown/Gold */
        .banner-liquidator { background: linear-gradient(to right, #742a2a, #c53030); } /* Dark Red */
        .banner-bagholder { background: linear-gradient(to right, #ed8936, #f6ad55); } /* Orange */
        .banner-novice { background-color: #4a5568; } /* Gray */
        .banner-aspiring { background: linear-gradient(to right, #3182ce, #63b3ed); } /* Blue */
        .banner-pro { background: linear-gradient(to right, #38a169, #68d391); } /* Green */
        .banner-seasoned { background: linear-gradient(to right, #d69e2e, #f6e05e); } /* Yellow/Gold */
        .banner-maven { background: linear-gradient(to right, #805ad5, #b794f4); } /* Purple */
        .banner-wolf { background: linear-gradient(to right, #c53030, #f56565); } /* Red */
        .banner-overlord {
            background: linear-gradient(-45deg, #1a202c, #2d3748, #4a5568, #718096);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
        }
        .banner-legendary {
            background: linear-gradient(-45deg, #4f46e5, #7c3aed, #db2777, #f59e0b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .flash-animation {
            animation: flash 1.5s ease-out;
        }
        @keyframes flash {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 25px 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }
    </style>
</head>
<body class="p-4 pt-16">

    <div id="title-banner" class="fixed top-0 left-0 right-0 z-20 p-2 text-center text-white font-bold text-lg shadow-lg banner-novice">
        <span id="player-title">Novice Trader</span>
    </div>

    <div class="flex flex-col lg:grid lg:grid-cols-3 lg:grid-rows-[min-content_1fr_min-content] gap-4 h-full">
        
        <div class="card rounded-lg p-4 shadow-lg lg:col-start-3 lg:row-start-1">
            <h2 class="text-xl font-bold mb-4">Settings</h2>
            <div class="space-y-3">
                 <div>
                    <label for="timeframe-select" class="block text-sm font-medium text-gray-300 mb-1">Timeframe</label>
                    <select id="timeframe-select" class="w-full bg-gray-800 border border-gray-600 rounded-md p-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="1">1 Minute</option>
                        <option value="5" selected>5 Minutes</option>
                        <option value="15">15 Minutes</option>
                        <option value="60">1 Hour</option>
                    </select>
                </div>
                 <div class="grid grid-cols-2 gap-3">
                    <select id="candle-type" class="w-full bg-gray-800 border border-gray-600 rounded-md p-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="candlestick" selected>Candlestick</option>
                        <option value="heikinashi">Heikin Ashi</option>
                    </select>
                    <button id="reset-view-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">Auto</button>
                </div>
                <div>
                    <label for="speed-slider" class="block text-sm font-medium text-gray-300">Game Speed</label>
                    <div class="flex items-center gap-2">
                        <input type="range" id="speed-slider" min="1" max="200" value="1" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                        <span id="speed-value" class="font-semibold text-indigo-400 w-12 text-center">1x</span>
                    </div>
                </div>
                <div class="flex items-center justify-between pt-2">
                    <span class="text-sm font-medium text-gray-300">Trade Signals</span>
                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" id="signals-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                        <label for="signals-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer"><span class="toggle-ball absolute block w-6 h-6 rounded-full bg-white shadow inset-y-0 left-0"></span></label>
                    </div>
                </div>
                <div class="flex items-center justify-between pt-2">
                    <span class="text-sm font-medium text-gray-300">Trading Bot 🤖</span>
                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" id="bot-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                        <label for="bot-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer"><span class="toggle-ball absolute block w-6 h-6 rounded-full bg-white shadow inset-y-0 left-0"></span></label>
                    </div>
                </div>
            </div>
        </div>

        <div id="chart-container" class="flex-grow rounded-lg shadow-lg card p-2 min-h-[300px] lg:col-span-2 lg:row-span-2 lg:col-start-1 lg:row-start-1">
            <canvas id="trading-chart"></canvas>
        </div>

        <div class="card rounded-lg p-4 shadow-lg lg:col-start-3 lg:row-start-2">
            <h2 class="text-xl font-bold mb-4">Place Trade</h2>
            <div class="space-y-4">
                <div>
                    <label for="trade-size" class="block text-sm font-medium text-gray-300">Trade Size (Margin)</label>
                    <input type="number" id="trade-size" value="100" class="w-full mt-1 bg-gray-800 border border-gray-600 rounded-md p-2 focus:ring-indigo-500 focus:border-indigo-500">
                    <div id="size-percentage-buttons" class="grid grid-cols-4 gap-2 mt-2">
                        <button class="bg-gray-700 hover:bg-gray-600 text-xs py-1 rounded transition-colors" data-percent="0.25">25%</button>
                        <button class="bg-gray-700 hover:bg-gray-600 text-xs py-1 rounded transition-colors" data-percent="0.50">50%</button>
                        <button class="bg-gray-700 hover:bg-gray-600 text-xs py-1 rounded transition-colors" data-percent="0.75">75%</button>
                        <button class="bg-gray-700 hover:bg-gray-600 text-xs py-1 rounded transition-colors" data-percent="1.00">100%</button>
                    </div>
                </div>
                <div>
                    <label for="leverage" class="block text-sm font-medium text-gray-300">Leverage</label>
                    <div class="flex items-center gap-2">
                        <input type="range" id="leverage" min="1" max="100" value="10" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                        <span id="leverage-value" class="font-semibold text-indigo-400 w-12 text-center">10x</span>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button id="long-button" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">Long</button>
                    <button id="short-button" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">Short</button>
                </div>
            </div>
        </div>

        <div id="positions-panel" class="min-h-[150px] overflow-y-auto rounded-lg shadow-lg card p-4 lg:col-span-2 lg:col-start-1 lg:row-start-3">
            <h2 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">Open Positions</h2>
            <div id="positions-list" class="space-y-2">
                <p id="no-positions-msg" class="text-gray-400">No open positions.</p>
            </div>
        </div>
        
        <div class="card rounded-lg p-4 shadow-lg lg:col-start-3 lg:row-start-3">
             <h2 class="text-xl font-bold mb-3">Account</h2>
            <div class="space-y-2 text-sm">
                <div class="flex justify-between"><span>Balance:</span> <span id="balance">$10,000.00</span></div>
                <div class="flex justify-between"><span>Equity:</span> <span id="equity">$10,000.00</span></div>
                <div class="flex justify-between"><span>Unrealized P/L:</span> <span id="unrealized-pl">$0.00</span></div>
            </div>
        </div>
    </div>

    <div id="message-box" class="fixed top-20 right-5 bg-indigo-600 text-white py-2 px-4 rounded-lg shadow-lg opacity-0 pointer-events-none z-50 transition-opacity duration-300 ease-in-out">
        <p id="message-text"></p>
    </div>

    <div id="game-over-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
        <div class="card p-8 rounded-lg text-center max-w-sm">
            <h2 class="text-4xl font-bold text-red-500 mb-4">LIQUIDATED</h2>
            <p class="text-gray-300 mb-6">Your account equity fell to zero. Better luck next time!</p>
            <div class="text-left space-y-2 mb-8">
                <p><strong>Final Title:</strong> <span id="final-title"></span></p>
                <p><strong>Peak Equity:</strong> <span id="peak-equity"></span></p>
                <p><strong>Total Trades:</strong> <span id="total-trades"></span></p>
            </div>
            <button id="play-again-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition-colors text-lg">Play Again</button>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Element References ---
            const signalsToggle = document.getElementById('signals-toggle');
            const botToggle = document.getElementById('bot-toggle');
            const balanceEl = document.getElementById('balance');
            const equityEl = document.getElementById('equity');
            const unrealizedPlEl = document.getElementById('unrealized-pl');
            const leverageSlider = document.getElementById('leverage');
            const leverageValueEl = document.getElementById('leverage-value');
            const tradeSizeInput = document.getElementById('trade-size');
            const longButton = document.getElementById('long-button');
            const shortButton = document.getElementById('short-button');
            const positionsListEl = document.getElementById('positions-list');
            const noPositionsMsgEl = document.getElementById('no-positions-msg');
            const candleTypeSelect = document.getElementById('candle-type');
            const speedSlider = document.getElementById('speed-slider');
            const speedValueEl = document.getElementById('speed-value');
            const resetViewBtn = document.getElementById('reset-view-btn');
            const timeframeSelect = document.getElementById('timeframe-select');
            const sizePercentageButtonsEl = document.getElementById('size-percentage-buttons');
            const titleBannerEl = document.getElementById('title-banner');
            const playerTitleEl = document.getElementById('player-title');
            const gameOverModalEl = document.getElementById('game-over-modal');
            const playAgainBtn = document.getElementById('play-again-btn');
            const finalTitleEl = document.getElementById('final-title');
            const peakEquityEl = document.getElementById('peak-equity');
            const totalTradesEl = document.getElementById('total-trades');

            // --- Game State ---
            const STARTING_BALANCE = 10000;
            let account = { balance: STARTING_BALANCE, equity: STARTING_BALANCE };
            let playerStats = { highestEquity: STARTING_BALANCE, totalTrades: 0, playerTitle: '' };
            let openPositions = [];
            let masterOneMinuteData = [];
            let lastPrice = 50000;
            let lastTime = new Date().getTime();
            let gameLoopInterval;
            const MAX_DATA_POINTS = 10000;
            let showSignals = false;
            let isBotActive = false;
            let lastBotSignalTime = 0;
            
            // --- Title Tiers ---
            const titles = [
                { balance: 1000000, name: 'Legendary Leviathan 🐋', className: 'banner-legendary' },
                { balance: 500000,  name: 'Galactic Overlord 🚀',   className: 'banner-overlord' },
                { balance: 250000,  name: 'Wall Street Wolf 🐺',   className: 'banner-wolf' },
                { balance: 100000,  name: 'Market Maven 🧠',      className: 'banner-maven' },
                { balance: 50000,   name: 'Seasoned Speculator 🧐',className: 'banner-seasoned' },
                { balance: 25000,   name: 'Pro Piker 📈',        className: 'banner-pro' },
                { balance: 15000,   name: 'Aspiring Analyst 🤓',  className: 'banner-aspiring' },
                { balance: 10000,   name: 'Novice Trader 🌱',     className: 'banner-novice' },
                { balance: 7500,    name: 'Aspiring Bagholder 🛍️', className: 'banner-bagholder' },
                { balance: 5000,    name: 'Expert Liquidator 📉',  className: 'banner-liquidator' },
                { balance: 0,       name: 'Ramen Connoisseur 🍜',  className: 'banner-ramen' }
            ];

            // --- Chart.js State ---
            const ctx = document.getElementById('trading-chart').getContext('2d');
            let tradingChart;
            let uiNeedsUpdate = true;
            const DEFAULT_VISIBLE_CANDLES = 50;
            const MIN_VISIBLE_CANDLES = 20;
            let visibleCandleCount = DEFAULT_VISIBLE_CANDLES;
            let currentTimeframe = 5;

            // --- Chart.js Setup ---
            function createChart(persistedAnnotations = {}) {
                if (tradingChart) tradingChart.destroy();
                const config = {
                    type: 'candlestick',
                    data: { datasets: [{ label: 'Price', data: [] }] },
                    options: {
                        responsive: true, maintainAspectRatio: false, animation: false,
                        scales: {
                            x: { type: 'time', time: { unit: 'minute' }, grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#E0E0E0' } },
                            y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#E0E0E0' } }
                        },
                        plugins: {
                            tooltip: { enabled: false },
                            legend: { display: false },
                            annotation: { annotations: persistedAnnotations },
                            zoom: {
                                pan: { enabled: false },
                                zoom: {
                                    wheel: { enabled: true }, mode: 'x',
                                    onZoom: ({ chart }) => {
                                        const timespan = chart.scales.x.max - chart.scales.x.min;
                                        const timeframeMillis = currentTimeframe * 60 * 1000;
                                        const newCandleCount = Math.round(timespan / timeframeMillis);
                                        visibleCandleCount = Math.max(MIN_VISIBLE_CANDLES, newCandleCount);
                                        uiNeedsUpdate = true;
                                    }
                                }
                            }
                        }
                    }
                };
                tradingChart = new Chart(ctx, config);
            }
            
            // --- Indicator Calculation Functions (collapsed for brevity) ---
            function calculateEMA(data, period) { const k = 2 / (period + 1); let ema = [{ x: data[0].x, y: data[0].c }]; for (let i = 1; i < data.length; i++) { const newEma = (data[i].c * k) + (ema[i-1].y * (1 - k)); ema.push({ x: data[i].x, y: newEma }); } return ema; }
            function calculateRSI(data, period) { let rsi = []; let gains = 0; let losses = 0; for (let i = 1; i < data.length; i++) { const change = data[i].c - data[i-1].c; if (i < period) { if (change > 0) gains += change; else losses -= change; } else { if (i === period) { gains /= period; losses /= period; } else { gains = (gains * (period - 1) + (change > 0 ? change : 0)) / period; losses = (losses * (period - 1) + (change < 0 ? -change : 0)) / period; } if (losses === 0) { rsi.push({ x: data[i].x, y: 100 }); } else { const rs = gains / losses; rsi.push({ x: data[i].x, y: 100 - (100 / (1 + rs)) }); } } } return rsi; }
            function calculateSignals(data) { if (data.length < 22) return []; const signals = []; const emaFast = calculateEMA(data, 9); const emaSlow = calculateEMA(data, 21); const rsi = calculateRSI(data, 14); const rsiStartOffset = data.length - rsi.length; for (let i = 1; i < rsi.length; i++) { const dataIndex = i + rsiStartOffset; const trendScore = emaFast[dataIndex].y > emaSlow[dataIndex].y ? 1 : -1; const prevTrendScore = emaFast[dataIndex - 1].y > emaSlow[dataIndex - 1].y ? 1 : -1; const rsiValue = rsi[i].y; let currentSignal = 0; if (trendScore === 1 && prevTrendScore === -1 && rsiValue < 70) { currentSignal = 1; } else if (trendScore === -1 && prevTrendScore === 1 && rsiValue > 30) { currentSignal = -1; } if (currentSignal !== 0) { signals.push({ x: data[dataIndex].x, direction: currentSignal === 1 ? 'buy' : 'sell', price: data[dataIndex].l * 0.998, priceSell: data[dataIndex].h * 1.002 }); } } return signals; }

            // --- Bot Logic ---
            function botDecisionLoop() { if (!isBotActive) return; const aggregatedData = aggregateData(masterOneMinuteData, currentTimeframe); if (aggregatedData.length < 22) return; const signals = calculateSignals(aggregatedData); const lastSignal = signals.length > 0 ? signals[signals.length - 1] : null; if (!lastSignal || lastSignal.x <= lastBotSignalTime) return; if (lastSignal.direction === 'buy') { let botPosition = openPositions.find(p => p.isBotTrade); if (botPosition && botPosition.type === 'short') { closePosition(botPosition.id); botPosition = null; } if (!botPosition) { executeTrade('long', account.balance * 0.25, 10, true); lastBotSignalTime = lastSignal.x; } } else if (lastSignal.direction === 'sell') { let botPosition = openPositions.find(p => p.isBotTrade); if (botPosition && botPosition.type === 'long') { closePosition(botPosition.id); botPosition = null; } if (!botPosition) { executeTrade('short', account.balance * 0.25, 10, true); lastBotSignalTime = lastSignal.x; } } }

            // --- Game & Render Loops ---
            function gameLoop() {
                masterOneMinuteData.push(generateOneMinuteCandle());
                if (masterOneMinuteData.length > MAX_DATA_POINTS) masterOneMinuteData.shift();

                botDecisionLoop();

                let totalPnl = 0;
                openPositions.forEach(pos => {
                    const priceDiff = lastPrice - pos.entryPrice;
                    const quantity = (pos.margin * pos.leverage) / pos.entryPrice;
                    pos.pnl = (pos.type === 'long') ? priceDiff * quantity : -priceDiff * quantity;
                    totalPnl += pos.pnl;
                });
                account.equity = account.balance + totalPnl;

                if (account.equity <= 0) {
                    triggerGameOver();
                    return;
                }

                playerStats.highestEquity = Math.max(playerStats.highestEquity, account.equity);
                updatePlayerTitle();
                uiNeedsUpdate = true;
            }
            function renderLoop() { if (uiNeedsUpdate && masterOneMinuteData.length > 0) { const aggregatedData = aggregateData(masterOneMinuteData, currentTimeframe); let displayData = (candleTypeSelect.value === 'heikinashi') ? toHeikinAshi(aggregatedData) : aggregatedData; if (displayData.length === 0) { requestAnimationFrame(renderLoop); return; } tradingChart.data.datasets[0].data = displayData; const currentAnnotations = tradingChart.options.plugins.annotation.annotations; Object.keys(currentAnnotations).forEach(key => { if (key.startsWith('signal-')) { delete currentAnnotations[key]; } }); if (showSignals) { const signals = calculateSignals(displayData); signals.forEach(signal => { currentAnnotations[`signal-${signal.x}`] = { type: 'label', xValue: signal.x, yValue: signal.direction === 'buy' ? signal.price : signal.priceSell, content: signal.direction === 'buy' ? '🔼' : '🔽', color: signal.direction === 'buy' ? '#26A69A' : '#EF5350', font: { size: 16 }, yAdjust: signal.direction === 'buy' ? 10 : -10 }; }); } const lastCandleTime = displayData[displayData.length - 1].x; const firstVisibleCandleIndex = Math.max(0, displayData.length - visibleCandleCount); const firstVisibleCandleTime = displayData[firstVisibleCandleIndex].x; tradingChart.options.scales.x.max = lastCandleTime; tradingChart.options.scales.x.min = firstVisibleCandleTime; tradingChart.update('none'); balanceEl.textContent = `$${account.balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`; equityEl.textContent = `$${account.equity.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`; const totalPnl = account.equity - account.balance; unrealizedPlEl.textContent = `$${totalPnl.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`; unrealizedPlEl.style.color = totalPnl >= 0 ? '#4ade80' : '#f87171'; updatePositionsList(); uiNeedsUpdate = false; } requestAnimationFrame(renderLoop); }
            
            // --- Game Flow, Save/Load Functions ---
            function triggerGameOver() {
                if(gameLoopInterval) clearInterval(gameLoopInterval);
                updatePlayerTitle(); // Final title check
                finalTitleEl.textContent = playerStats.playerTitle;
                peakEquityEl.textContent = `$${playerStats.highestEquity.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                totalTradesEl.textContent = playerStats.totalTrades;
                gameOverModalEl.classList.remove('hidden');
            }
            function resetGame() {
                localStorage.removeItem('tradingGameSave'); // Clear saved progress
                account = { balance: STARTING_BALANCE, equity: STARTING_BALANCE };
                playerStats = { highestEquity: STARTING_BALANCE, totalTrades: 0, playerTitle: '' };
                openPositions = [];
                lastBotSignalTime = 0;
                
                positionsListEl.innerHTML = '<p id="no-positions-msg" class="text-gray-400">No open positions.</p>';
                
                regenerateMasterData();
                createChart();
                updatePlayerTitle();
                
                gameOverModalEl.classList.add('hidden');
                
                const currentSpeed = parseInt(speedSlider.value, 10);
                setGameSpeed(currentSpeed);
                uiNeedsUpdate = true;
            }
            function saveGame() {
                const gameState = {
                    account: account,
                    playerStats: playerStats,
                    openPositions: openPositions,
                    masterOneMinuteData: masterOneMinuteData,
                    lastPrice: lastPrice,
                    lastTime: lastTime
                };
                localStorage.setItem('tradingGameSave', JSON.stringify(gameState));
            }
            function loadGame() {
                const savedStateJSON = localStorage.getItem('tradingGameSave');
                if (savedStateJSON) {
                    try {
                        const savedState = JSON.parse(savedStateJSON);
                        account = savedState.account;
                        playerStats = savedState.playerStats;
                        openPositions = savedState.openPositions;
                        masterOneMinuteData = savedState.masterOneMinuteData;
                        lastPrice = savedState.lastPrice;
                        lastTime = savedState.lastTime;
                        showMessage("Game progress loaded!", "info");
                        return true;
                    } catch (e) {
                        console.error("Failed to load saved game state:", e);
                        localStorage.removeItem('tradingGameSave');
                        return false;
                    }
                }
                return false;
            }
            
            // --- Initial Setup ---
            function init() {
                const gameLoaded = loadGame();
                currentTimeframe = parseInt(timeframeSelect.value, 10);
                
                if (!gameLoaded) {
                    regenerateMasterData();
                }

                const initialAnnotations = {};
                openPositions.forEach(pos => {
                    initialAnnotations[pos.id] = createAnnotationForPosition(pos);
                });

                createChart(initialAnnotations);
                updatePlayerTitle();
                setGameSpeed(1);
                requestAnimationFrame(renderLoop);
            }

            // --- Event Listeners ---
            signalsToggle.addEventListener('change', () => { showSignals = signalsToggle.checked; uiNeedsUpdate = true; });
            botToggle.addEventListener('change', () => { isBotActive = botToggle.checked; showMessage(isBotActive ? "Trading Bot Activated! 🤖" : "Trading Bot Deactivated.", "info"); });
            leverageSlider.addEventListener('input', (e) => { leverageValueEl.textContent = `${e.target.value}x`; });
            speedSlider.addEventListener('input', (e) => { const speed = parseInt(e.target.value, 10); speedValueEl.textContent = `${speed}x`; setGameSpeed(speed); });
            resetViewBtn.addEventListener('click', () => { visibleCandleCount = DEFAULT_VISIBLE_CANDLES; uiNeedsUpdate = true; });
            timeframeSelect.addEventListener('change', (e) => { currentTimeframe = parseInt(e.target.value, 10); visibleCandleCount = DEFAULT_VISIBLE_CANDLES; uiNeedsUpdate = true; });
            sizePercentageButtonsEl.addEventListener('click', (e) => { if (e.target.tagName === 'BUTTON' && e.target.dataset.percent) { const percent = parseFloat(e.target.dataset.percent); const newSize = account.balance * percent; tradeSizeInput.value = newSize.toFixed(2); } });
            longButton.addEventListener('click', () => placeTrade('long'));
            shortButton.addEventListener('click', () => placeTrade('short'));
            candleTypeSelect.addEventListener('change', () => uiNeedsUpdate = true);
            playAgainBtn.addEventListener('click', resetGame);
            window.addEventListener('beforeunload', saveGame);

            // --- Utility Functions ---
            function createAnnotationForPosition(pos) { return { type: 'line', yMin: pos.entryPrice, yMax: pos.entryPrice, borderColor: pos.type === 'long' ? '#26A69A' : '#EF5350', borderWidth: 2, borderDash: [6, 6], label: { content: `${pos.isBotTrade ? '🤖 ' : ''}${pos.type.toUpperCase()} @ ${pos.entryPrice.toFixed(2)}`, enabled: true, position: 'end', backgroundColor: 'rgba(0,0,0,0.6)' } }; }
            function updatePlayerTitle() { let newTitleData = titles[titles.length - 1]; for (const title of titles) { if (account.balance >= title.balance) { newTitleData = title; break; } } if (newTitleData.name !== playerStats.playerTitle) { playerStats.playerTitle = newTitleData.name; playerTitleEl.textContent = newTitleData.name; const bannerClasses = titles.map(t => t.className); titleBannerEl.classList.remove(...bannerClasses); titleBannerEl.classList.add(newTitleData.className); titleBannerEl.classList.remove('flash-animation'); void titleBannerEl.offsetWidth; titleBannerEl.classList.add('flash-animation'); } }
            function generateOneMinuteCandle() { const changePercent = (Math.random() - 0.5) * 0.005; const change = lastPrice * changePercent; const open = lastPrice; const close = open + change; const high = Math.max(open, close) + (Math.random() * Math.abs(change) * 2); const low = Math.min(open, close) - (Math.random() * Math.abs(change) * 2); lastPrice = close; lastTime += 60000; return { x: lastTime, o: open, h: high, l: low, c: close }; }
            function regenerateMasterData() { masterOneMinuteData = []; lastPrice = 50000; const historyMinutes = 5000; lastTime = new Date().getTime() - (historyMinutes * 60000); for (let i = 0; i < historyMinutes; i++) masterOneMinuteData.push(generateOneMinuteCandle()); }
            function aggregateData(data, timeframeMinutes) { if (timeframeMinutes <= 1) return data; const aggregated = []; let currentCandle = null; for (const candle of data) { const candleTime = new Date(candle.x); const intervalStart = new Date(candleTime); intervalStart.setMinutes(Math.floor(candleTime.getMinutes() / timeframeMinutes) * timeframeMinutes, 0, 0); if (!currentCandle || currentCandle.x !== intervalStart.getTime()) { if (currentCandle) aggregated.push(currentCandle); currentCandle = { x: intervalStart.getTime(), o: candle.o, h: candle.h, l: candle.l, c: candle.c }; } else { currentCandle.h = Math.max(currentCandle.h, candle.h); currentCandle.l = Math.min(currentCandle.l, candle.l); currentCandle.c = candle.c; } } if (currentCandle) aggregated.push(currentCandle); return aggregated; }
            function toHeikinAshi(data) { if (data.length < 1) return []; const haData = []; let prevHaOpen = data[0].o; let prevHaClose = data[0].c; for (let i = 0; i < data.length; i++) { const curr = data[i]; const haClose = (curr.o + curr.h + curr.l + curr.c) / 4; const haOpen = (prevHaOpen + prevHaClose) / 2; const haHigh = Math.max(curr.h, haOpen, haClose); const haLow = Math.min(curr.l, haOpen, haClose); haData.push({ x: curr.x, o: haOpen, h: haHigh, l: haLow, c: haClose }); prevHaOpen = haOpen; prevHaClose = haClose; } return haData; }
            function placeTrade(type) { const size = parseFloat(tradeSizeInput.value); const leverage = parseInt(leverageSlider.value); executeTrade(type, size, leverage, false); }
            function executeTrade(type, margin, leverage, isBot = false) { if (isNaN(margin) || margin <= 0) { if (!isBot) showMessage("Please enter a valid trade size.", "error"); return; } if (margin > account.balance) { if (!isBot) showMessage("Trade size cannot exceed your balance.", "error"); return; } playerStats.totalTrades++; const position = { id: `pos-${Date.now()}`, type, margin, leverage, entryPrice: lastPrice, pnl: 0, isBotTrade: isBot, }; const annotation = createAnnotationForPosition(position); tradingChart.options.plugins.annotation.annotations[position.id] = annotation; openPositions.push(position); uiNeedsUpdate = true; }
            function closePosition(id) { const positionIndex = openPositions.findIndex(p => p.id === id); if (positionIndex > -1) { const position = openPositions[positionIndex]; account.balance += position.pnl; delete tradingChart.options.plugins.annotation.annotations[id]; document.getElementById(id)?.remove(); openPositions.splice(positionIndex, 1); uiNeedsUpdate = true; } }
            function updatePositionsList() { const noMsg = document.getElementById('no-positions-msg'); if(noMsg) noMsg.style.display = openPositions.length === 0 ? 'block' : 'none'; openPositions.forEach(pos => { let posEl = document.getElementById(pos.id); if (!posEl) { posEl = document.createElement('div'); posEl.id = pos.id; posEl.innerHTML = `<span class="font-bold"></span><span></span><span></span><span></span><button class="close-pos-btn bg-gray-600 hover:bg-gray-500 text-white text-xs py-1 px-2 rounded">Close</button>`; positionsListEl.appendChild(posEl); posEl.querySelector('.close-pos-btn').addEventListener('click', () => closePosition(pos.id)); } const pnlColor = pos.pnl >= 0 ? 'text-green-400' : 'text-red-400'; const bgColor = pos.pnl >= 0 ? 'bg-green-900/30' : 'bg-red-900/30'; const typeColor = pos.type === 'long' ? 'text-green-400' : 'text-red-400'; posEl.className = `grid grid-cols-5 gap-2 items-center text-sm p-2 rounded-md ${bgColor}`; const fields = posEl.children; fields[0].className = `font-bold ${typeColor}`; fields[0].textContent = (pos.isBotTrade ? '🤖 ' : '') + pos.type.toUpperCase(); fields[1].textContent = `$${pos.margin.toFixed(2)} (${pos.leverage}x)`; fields[2].textContent = pos.entryPrice.toFixed(2); fields[3].className = pnlColor; fields[3].textContent = pos.pnl.toFixed(2); }); }
            function setGameSpeed(speed) { if (gameLoopInterval) clearInterval(gameLoopInterval); const intervalTime = Math.max(1, 1000 / speed); gameLoopInterval = setInterval(gameLoop, intervalTime); }
            let messageTimeout; function showMessage(text, type = "info", duration = 3000) { const messageBox = document.getElementById('message-box'); const messageText = document.getElementById('message-text'); if (messageTimeout) clearTimeout(messageTimeout); messageBox.style.backgroundColor = type === 'error' ? '#dc2626' : '#4f46e5'; messageText.textContent = text; messageBox.classList.remove('opacity-0', 'pointer-events-none'); messageTimeout = setTimeout(() => { messageBox.classList.add('opacity-0'); setTimeout(() => messageBox.classList.add('pointer-events-none'), 300); }, duration); }

            init();
        });
    </script>
</body>
